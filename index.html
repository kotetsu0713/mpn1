<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>大腸菌 MPN自動算出ツール</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f7f6; color: #333; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1 { text-align: center; font-size: 20px; color: #2c3e50; }
        .caption { text-align: center; font-size: 12px; color: #7f8c8d; margin-bottom: 20px; }
        .input-group { margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; }
        label { font-weight: bold; width: 40%; }
        select { width: 55%; padding: 8px; font-size: 16px; border-radius: 5px; border: 1px solid #ccc; }
        button { width: 100%; padding: 12px; background-color: #4CAF50; color: white; border: none; border-radius: 5px; font-size: 16px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .result { margin-top: 20px; padding: 15px; background-color: #e8f5e9; border-left: 5px solid #4CAF50; border-radius: 4px; display: none; }
        .result-title { font-weight: bold; margin-bottom: 8px; color: #2e7d32; }
        .mpn-val { font-size: 22px; font-weight: bold; color: #d32f2f; margin: 10px 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>🔬 大腸菌 MPN自動算出ツール</h1>
    <div class="caption">BGLB培地を用いた最確数法（5本法）</div>
    
    <div class="input-group"><label>10 mL</label><select id="v10"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
    <div class="input-group"><label>1 mL</label><select id="v1"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
    <div class="input-group"><label>0.1 mL</label><select id="v01"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
    <div class="input-group"><label>0.01 mL</label><select id="v001"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>
    <div class="input-group"><label>0.001 mL</label><select id="v0001"><option>0</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>

    <button onclick="calculateMPN()">MPNを算出する</button>

    <div id="resultBox" class="result">
        <div class="result-title">【判定結果】</div>
        <div id="resCode" style="font-size:14px;"></div>
        <div id="resMpn" class="mpn-val"></div>
        <div id="resLimit" style="font-size:14px; font-weight:bold;"></div>
    </div>
</div>

<script>
const MPN_TABLE = {
    "0-0-0": [0, 0, 6.0], "1-0-0": [2.0, 0.1, 11.2], "2-0-0": [4.5, 0.6, 17.5], "3-0-0": [7.8, 1.7, 24.6],
    "4-0-0": [13.0, 4.0, 34.7], "5-0-0": [23.0, 9.0, 86.0], "5-1-0": [33.0, 11.0, 93.0], "5-2-0": [49.0, 15.0, 150.0],
    "5-3-0": [79.0, 25.0, 250.0], "5-3-1": [110.0, 35.0, 300.0], "5-4-0": [130.0, 43.0, 490.0], "5-4-1": [170.0, 57.0, 700.0],
    "5-5-0": [240.0, 75.0, 1000.0], "5-5-1": [350.0, 120.0, 1800.0], "5-5-2": [540.0, 180.0, 2600.0],
    "5-5-3": [920.0, 300.0, 3200.0], "5-5-4": [1600.0, 640.0, 5800.0], "5-5-5": [2400.0, 1200.0, 10000.0]
};

function calculateMPN() {
    let v10 = parseInt(document.getElementById('v10').value);
    let v1 = parseInt(document.getElementById('v1').value);
    let v01 = parseInt(document.getElementById('v01').value);
    let v001 = parseInt(document.getElementById('v001').value);
    let v0001 = parseInt(document.getElementById('v0001').value);

    let inputs = [v10, v1, v01, v001, v0001];
    let idx = 0;
    let factor = 1.0;

    if (v10 === 5 && v1 === 5 && v01 === 5) {
        if (v001 > 0 || v0001 > 0) { idx = 2; factor = 100.0; }
        else if (v001 === 5) { idx = 2; factor = 100.0; }
    } else if (v10 === 5 && v1 === 5) {
        if (v01 > 0 || v001 > 0) { idx = 1; factor = 10.0; }
    }
    if (v10 === 0 && v1 === 0 && v01 === 0) { idx = 0; factor = 1.0; }

    let code = `${inputs[idx]}-${inputs[idx+1]}-${inputs[idx+2]}`;
    let stages = ["10mL", "1mL", "0.1mL", "0.01mL", "0.001mL"];
    let selStages = `${stages[idx]}, ${stages[idx+1]}, ${stages[idx+2]}`;

    let rBox = document.getElementById('resultBox');
    rBox.style.display = "block";

    if (code in MPN_TABLE) {
        let val = MPN_TABLE[code];
        let finalMpn = val[0] * factor;
        let finalLower = val[1] * factor;
        let finalUpper = finalMpn === 0 ? val[2] : val[2] * factor;

        document.getElementById('resCode').innerHTML = `<b>採用コード:</b> ${code.replace(/-/g, ' - ')} (${selStages})`;
        document.getElementById('resMpn').innerHTML = finalMpn > 0 ? `${finalMpn} MPN/100mL` : "0 (検出限界以下)";
        document.getElementById('resLimit').innerHTML = `<b>95%信頼限界:</b> ${finalLower} 〜 ${finalUpper} MPN/100mL`;
    } else {
        document.getElementById('resCode').innerHTML = `<b>採用コード:</b> ${code.replace(/-/g, ' - ')}`;
        document.getElementById('resMpn').innerHTML = "MPN表に非掲載のパターン";
        document.getElementById('resLimit').innerHTML = "";
    }
}
</script>
</body>
</html>
